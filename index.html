<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Könyvtárkezelő</title>
</head>
<body>
    <table id="bookTable" border="1">
        <thead>
            <tr>
                <th>Cím</th>
                <th>Szerző</th>
                <th>Év</th>
                <th>Oldalszám</th>
                <th>Állapot</th>
                <th>Művelet</th>
            </tr>
            
        </thead>
        <tbody>
        </tbody>
    </table>

    <input type="text" id="cimInput" placeholder="Cím">
    <input type="text" id="szerzoInput" placeholder="Szerző">    
    <input type="number" id="kiadasiEvInput" placeholder="Kiadás éve">
    <input type="number" id="oldalszamInput" placeholder="Oldalszám">

<div>
    <button id="addBookBtn" onclick="addBook()" type="button">Könyv hozzáadása</button>
    <button id="saveButton" onclick="saveBooks()" type="button">Új könyv mentése</button>
    <button id="elerhetoKonyvekButton" onclick="elerhetoKonyvek()" type="button">Elérhető könyvek</button>
    <button id="osszesKonyvButton" onclick="osszesKonyv()" type="button">Összes könyv</button>
    <button id="LegregebbiKonyv" onclick="legregebbiKonyv()" type="button">Legrégebbi könyv</button>
    <button id="legvastagabbKonyv" onclick="legvastagabbKonyv()" type="button">Legvastagabb könyv</button>   

</div>
    
    <script src="app.js"></script>
</body>
</html>
